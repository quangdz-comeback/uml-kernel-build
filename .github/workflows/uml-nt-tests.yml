name: uml-nt tests (linux)

on:
  push:
    branches: ["uml-nt/**"]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests (pure logic, no network)
        run: |
          bash uml-nt/tests/test_fetch.sh
          bash uml-nt/tests/test_os_windows_skeleton.sh
          bash uml-nt/tests/test_scan_patch.sh
          bash uml-nt/tests/test_mm.sh
          # M3.7 uaccess walker (D15) over the vma tree
          bash uml-nt/tests/test_uaccess.sh
          # M4.1 bench stats — the pure math the freestanding kernel
          # ships must match the host test (sort/percentile/mean/eps)
          bash uml-nt/tests/test_bench.sh
          # M3.4 guest ELF loader — the real-fixture build needs lld
          # (same clang+lld recipe as the kernel job's guest build).
          if ! command -v ld.lld >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y lld llvm
          fi
          bash uml-nt/tests/test_elf.sh
          # M3.8 S4c: the rootfs now carries /bin/step2 (the exec-
          # chain proof binary) built from ../guest/step2.c — build
          # the guest targets before the image, same order as the
          # kernel job.
          make -C uml-nt/guest CC=clang LD=ld.lld
          # M3.5 gate rootfs — static freestanding /sbin/init + ext4
          # image (mke2fs -d, no root). Same recipe the kernel job's
          # mount gate consumes. S4c2: the image also carries busybox
          # (built from source, musl-gcc) — install musl-tools first.
          if ! command -v musl-gcc >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y musl-tools
          fi
          make -C uml-nt/rootfs
          debugfs -R "ls -l /sbin" uml-nt/rootfs/rootfs.ext4
          debugfs -R "ls -l /bin" uml-nt/rootfs/rootfs.ext4

      - name: ntabi ABI checks (ELF freestanding + mingw PE)
        run: |
          sudo apt-get install -y gcc-mingw-w64-x86-64
          bash uml-nt/tests/test_ntabi.sh

      - name: Pin check (network, cheap — validates tarball + file URLs + sha256 pin)
        run: bash uml-nt/kernel/fetch.sh check

      - name: Lint shell
        run: |
          shellcheck -x uml-nt/kernel/fetch.sh uml-nt/tests/test_fetch.sh \
            uml-nt/tests/test_os_windows_skeleton.sh uml-nt/tests/test_scan_patch.sh \
            uml-nt/tests/test_mm.sh uml-nt/tests/test_elf.sh \
            uml-nt/tests/test_uaccess.sh uml-nt/tests/test_bench.sh
