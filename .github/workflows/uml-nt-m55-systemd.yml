name: "uml-nt M5.5a systemd boot (native referee)"

# M5.4 c3 / M5.5a: boot a REAL systemd rootfs natively on the Windows
# runner. Wine cannot pass the arch_prctl wall (HANDOFF 4.1-11 — the
# c3 wine boots die there, rax=9e, after the whole loader chain maps
# clean), so native is the referee for everything past the guest
# loader chain.
#
# Rootfs: base-debian-bookworm.img from base_image.yml (Debian 12,
# glibc 2.36 + systemd 252 — the same shape as the local-only PVE
# image; downloaded from that workflow's artifacts, never committed —
# hard rule). Boot-failure-driven (greenlight 2026-09-30): every run
# prints the not-implemented syscall table + the furthest systemd
# marker; the gate tightens as clusters land. Gate (D21 era):
# multi-user.target, fallback journald Started (the env-poison
# SIGSEGV flake family still kills ~1/3 of boots pre-journald).
#
# workflow_dispatch only during the iteration loop (CI stays fast on
# push); flip to a weekly canary once multi-user.target is green (M5.5).
# The push trigger lists ONLY this file: GitHub registers a dispatch
# workflow from the branch when it first lands, but the event itself
# then never fires on ordinary pushes (paths filter).

on:
  workflow_dispatch:
    inputs:
      debugger:
        description: "uml_nt_dbg=1 (run stub.exe under the launcher's own mini-debugger)"
        type: boolean
        default: false
      veh_window:
        description: 'Refined A/B: remove the vectored handler for the first 4s of a login conn'
        type: boolean
        default: false
      feed:
        description: "feed the console at all (false = diagnostic A/B: is the input path the killer?)"
        type: boolean
        default: true
      xs_lever:
        description: "drop CONTEXT_XSTATE for the login chain only (ruling 223 A/B)"
        type: boolean
        default: false
      probe_off:
        description: "append uml_nt_drexec=0 (A/B: the DR-execute probe off)"
        type: boolean
        default: false
      witness_off:
        description: "append uml_nt_witness=0 (exonerate guest-visible witnesses)"
        type: boolean
        default: false
  push:
    branches: ["uml-nt/**"]
    paths: [".github/workflows/uml-nt-m55-systemd.yml"]

permissions:
  contents: read
  actions: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
            update -y
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
            install -y build-essential flex bison bc patch xz-utils \
            clang lld llvm ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: uml-nt-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            uml-nt-ccache-${{ runner.os }}-

      - name: Fetch pinned v6.18.56 + apply uml-nt overlay
        run: |
          TREE=$(bash uml-nt/kernel/fetch.sh extract)
          bash uml-nt/kernel/apply.sh "$TREE"
          echo "TREE=$TREE" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=time_macros,include_file_mtime,include_file_ctime" >> "$GITHUB_ENV"

      - name: Build vmlinux (uml_nt_defconfig, clang+lld)
        run: |
          make -C "$TREE" O="$(pwd)/build" ARCH=um LLVM=1 CC="ccache clang" \
            LD=ld.lld uml_nt_defconfig
          make -C "$TREE" O="$(pwd)/build" ARCH=um LLVM=1 CC="ccache clang" \
            LD=ld.lld KBUILD_BUILD_TIMESTAMP="uml-nt" -j"$(nproc)"

      - name: Upload vmlinux.elf
        uses: actions/upload-artifact@v4
        with:
          name: uml-nt-vmlinux-elf
          path: build/vmlinux

      # Rootfs prep runs HERE (Linux): the mask needs loop-mounted ext4,
      # and the boot job is windows-latest. Masking touches the CI COPY
      # only — the canonical base_image artifact stays pristine.
      - name: Download base-debian-bookworm rootfs + mask cloud-init (D21 test-image rule)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest NON-EXPIRED uml-base-debian-bookworm artifact via the
          # artifacts API (`gh run list --workflow` filters by the current
          # git branch and can return a base_image run that never uploaded
          # the artifact — run 36841223033 died on that).
          RID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=uml-base-debian-bookworm&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | .[-1].workflow_run.id')
          echo "artifact lookup: ${RID:-EMPTY}"
          if [ -z "$RID" ]; then
            echo "no live uml-base-debian-bookworm artifact — re-run base_image.yml first" >&2
            exit 1
          fi
          echo "base_image run: $RID"
          gh run download "$RID" -R "${{ github.repository }}" \
            -n uml-base-debian-bookworm -D rootfs-img
          ls -lh rootfs-img
          # D21 test-image rule (ARCHITECTURE.md): cloud-init units are
          # provisioning fluff for this gate and exec python3.11 (6.8MB
          # ET_EXEC at low VAs — the D21 loader blocker: order-11 span >
          # MAX_PAGE_ORDER). Mask = canonical systemd /dev/null symlink in
          # /etc/systemd/system (shadows the unit wherever its wants-dir
          # link lives). D21 lifts these.
          IMG=rootfs-img/base-debian-bookworm.img
          sudo mkdir -p /mnt/m55a-rootfs
          sudo mount -o loop "$IMG" /mnt/m55a-rootfs
          for unit in cloud-init.service cloud-init-local.service \
                      cloud-config.service cloud-final.service \
                      systemd-cloud-init.service; do
            if [ -e "/mnt/m55a-rootfs/lib/systemd/system/$unit" ] \
               || [ -L "/mnt/m55a-rootfs/etc/systemd/system/$unit" ]; then
              sudo ln -sf /dev/null "/mnt/m55a-rootfs/etc/systemd/system/$unit"
              echo "masked: $unit"
            else
              echo "not present, skipped: $unit"
            fi
          done
          # S426 minimal profile: keep systemd PID 1 and the console chain the
          # gate measures (getty@tty0 -> agetty -> /bin/login). Mask the rest:
          # 15-21 victims and the stall came from services, not from the engine.
          MIN_MASK="systemd-networkd.service systemd-networkd.socket systemd-networkd-wait-online.service systemd-resolved.service systemd-timesyncd.service ssh.service ssh.socket sshd.service cron.service atd.service systemd-userdbd.service systemd-userdbd.socket systemd-homed.service systemd-machined.service ModemManager.service packagekit.service unattended-upgrades.service apt-daily.service apt-daily-upgrade.service man-db.service e2scrub_all.service"
          MIN_N=0
          for unit in $MIN_MASK; do
            if [ -e "/mnt/m55a-rootfs/usr/lib/systemd/system/$unit" ] || [ -e "/mnt/m55a-rootfs/lib/systemd/system/$unit" ]; then
              sudo ln -sf /dev/null "/mnt/m55a-rootfs/etc/systemd/system/$unit"
              MIN_N=$((MIN_N + 1))
            fi
          done
          sudo mkdir -p /mnt/m55a-rootfs/etc/systemd/journald.conf.d
          printf "[Journal]\nForwardToConsole=yes\nTTYPath=/dev/console\nMaxLevelConsole=info\n" | sudo tee /mnt/m55a-rootfs/etc/systemd/journald.conf.d/uml-nt-console.conf >/dev/null
          PROFILE_SHA=$(printf %s "$MIN_MASK" | sha256sum | cut -c1-12)
          MISSED=""
          for unit in $MIN_MASK; do
            if [ -e "/mnt/m55a-rootfs/usr/lib/systemd/system/$unit" ] || [ -e "/mnt/m55a-rootfs/lib/systemd/system/$unit" ]; then
              if [ "$(readlink -f "/mnt/m55a-rootfs/etc/systemd/system/$unit" 2>/dev/null)" != "/dev/null" ]; then MISSED="$MISSED $unit"; fi
            fi
          done
          if [ -n "$MISSED" ]; then echo "[prep] profile=minimal unmasked:$MISSED" >&2; exit 1; fi
          echo "[prep] profile=minimal units_masked=$MIN_N sha=$PROFILE_SHA"
          # S447: pam_loginuid aborts the session without ever opening
          # /proc/self/loginuid — the bookworm module goes through netlink
          # (AUDIT_SET_LOGINUID) and reports 'op=PAM:session_open res=failed' on
          # the audit binary channel, even though our kernel ACKs error=0. It is
          # an auxiliary hardening module: LOGIN-OK measures whether the engine
          # gets the guest to a shell, not whether audit bookkeeping sticks.
          # Disabled in the TEST image only, declared, and enforced.
          PAMD=/mnt/m55a-rootfs/etc/pam.d
          # S448: the edit loop and the guard must see the SAME files. The first
          # version edited a hardcoded three (login, common-session, common-auth)
          # and then grepped the whole tree — sshd:22 also loads pam_loginuid, so
          # the guard was right and the edit was incomplete. One regex, used for
          # both: whatever grep -rl finds is what gets edited.
          LOGINUID_RE='^[[:space:]]*[a-z-]+[[:space:]]+[a-z]+[[:space:]]+.*pam_loginuid[.]so'
          grep -rlE "$LOGINUID_RE" "$PAMD" 2>/dev/null | while read -r f; do
            sudo sed -i -E "s|($LOGINUID_RE.*)$|# [uml-nt test image] pam_loginuid disabled: netlink bookkeeping, not a login prerequisite\n#\1|" "$f"
          done
          ACTIVE_LOGINUID=$(grep -rEc "$LOGINUID_RE" "$PAMD" 2>/dev/null | awk -F: '{s+=$2} END{print s+0}')
          if [ "${ACTIVE_LOGINUID:-0}" -ne 0 ]; then
            echo "[prep] pam_loginuid=present active=$ACTIVE_LOGINUID" >&2
            echo "pam_loginuid is still active — refusing to publish" >&2
            exit 1
          fi
          echo "[prep] pam_loginuid=commented active=0"
          # S449 branch A (D26 tier B): the session stack of /etc/pam.d/login is
          # replaced by the minimum that still measures the engine — pam_unix
          # only. Every other session module is a hardening layer whose failure
          # has cost four rounds without evidence of an engine fault. If login
          # reaches a shell with this, the engine chain is proven and only the
          # Debian stack remains to be explained.
          LOGIN_PAM=/mnt/m55a-rootfs/etc/pam.d/login
          if [ -f "$LOGIN_PAM" ]; then
            sudo cp "$LOGIN_PAM" "$LOGIN_PAM.orig"
            # keep auth/account/password untouched; rewrite session lines only
            sudo awk '
              /^[[:space:]]*session[[:space:]]/ { if (!done) {
                  print "# [uml-nt test image] session stack replaced (S449 A): engine measurement";
                  print "session    required     pam_unix.so";
                  done=1 }
                next }
              { print }' "$LOGIN_PAM.orig" | sudo tee "$LOGIN_PAM" >/dev/null
            SESS=$(grep -cE '^[[:space:]]*session[[:space:]]' "$LOGIN_PAM" || true)
            if [ "${SESS:-0}" -ne 1 ] || ! grep -qE '^session[[:space:]]+required[[:space:]]+pam_unix\.so' "$LOGIN_PAM"; then
              echo "[prep] session_minimal=FAILED sessions=$SESS" >&2
              echo "the session stack was not reduced — refusing to publish" >&2
              exit 1
            fi
            echo "[prep] session_minimal=1 sessions=1 (pam_unix only)"
          fi
          # S449 branch B: ask libpam to trace every session module it runs. The
          # last module logged before 'res=failed' is the culprit, named in the
          # guest's own syslog.
          for f in /mnt/m55a-rootfs/etc/pam.d/login /mnt/m55a-rootfs/etc/pam.d/common-session; do
            [ -f "$f" ] || continue
            sudo sed -i -E '/^[[:space:]]*session[[:space:]]/ { /[[:space:]]debug([[:space:]]|$)/! s/$/ debug/ }' "$f"
          done
          echo "[prep] pam_debug=session-lines (login, common-session)"
          # S446: /etc/securetty is absent in this base image, and pam_securetty
          # denies root on a terminal it cannot find in that file. This is a
          # console test image, so declare the terminals it actually uses.
          # Measured: the file does not exist; the module does.
          if [ -f /mnt/m55a-rootfs/etc/securetty ]; then
            echo "[prep] securetty=present"
          else
            printf 'console\ntty0\ntty1\nttyS0\n' | sudo tee /mnt/m55a-rootfs/etc/securetty >/dev/null
            sudo chmod 644 /mnt/m55a-rootfs/etc/securetty
            echo "[prep] securetty=created (console tty0 tty1 ttyS0)"
          fi
          # S430: removing pam_systemd was not enough. /etc/nsswitch.conf in
          # this image says "passwd: files systemd", so login's getpwnam("root")
          # goes through libnss_systemd -> userdb -> no daemon -> retry, and
          # agetty respawns it 26 times. Referees 42390998226 measured exactly
          # that: GetUserRecord=1 with pam_systemd already commented out.
          # Strip the systemd source from the account databases in the TEST image
          # (files stays; this is a local-account test image), declare it, and
          # fail if it survives.
          NSS_F=/mnt/m55a-rootfs/etc/nsswitch.conf
          if [ -f "$NSS_F" ]; then
            # S432: NO trailing comments. glibc's nsswitch parser does not accept
            # them: a comment at end of line breaks the whole line, every
            # database returns NOTFOUND, and login prints "could not identify
            # user (from getpwnam(root))" even though "files" is present. The
            # first version of this step did exactly that and broke every lookup.
            # The reason lives on its own line, above the data.
            sudo sed -i \
              -e 's/^\(passwd:\)[[:space:]].*/\1         files/' \
              -e 's/^\(group:\)[[:space:]].*/\1          files/' \
              -e 's/^\(shadow:\)[[:space:]].*/\1         files/' \
              -e 's/^\(gshadow:\)[[:space:]].*/\1        files/' \
              "$NSS_F"
            sudo sed -i '1i # [uml-nt test image] the systemd (userdb) source was removed from the account databases: this image carries no systemd-userdbd, so any lookup routed there hangs' "$NSS_F"
            # Enforce by USE, not by shape: the image must be able to resolve
            # root and messagebus. A grep can be satisfied by a file that no
            # longer parses.
            if ! sudo chroot /mnt/m55a-rootfs getent passwd root >/tmp/getent_root.txt 2>/dev/null \
               || ! grep -q '^root:' /tmp/getent_root.txt; then
              echo "[prep] getent-root=FAILED" >&2
              echo "the account databases do not resolve root — refusing to publish" >&2
              exit 1
            fi
            if ! sudo chroot /mnt/m55a-rootfs getent passwd messagebus >/tmp/getent_mb.txt 2>/dev/null \
               || ! grep -q '^messagebus:' /tmp/getent_mb.txt; then
              echo "[prep] getent-messagebus=FAILED" >&2
              echo "dbus.service needs a resolvable messagebus user — refusing to publish" >&2
              exit 1
            fi
            NSS_SHA=$(sha256sum "$NSS_F" | cut -c1-12)
            echo "[prep] nss_systemd=removed getent_root=OK getent_messagebus=OK sha=$NSS_SHA"
            echo "getent passwd root: $(cat /tmp/getent_root.txt)"
            echo "getent passwd messagebus: $(cat /tmp/getent_mb.txt)"
            grep -E '^(passwd|group|shadow|gshadow):' "$NSS_F" || true
          else
            echo "[prep] nss_systemd=no-nsswitch"
          fi
          # M5.5b-1 (S423): pam_systemd is loaded through
          # @include common-session, and it asks io.systemd.UserDatabase for
          # the session record. This test image carries NO systemd-userdbd unit
          # (measured: find over the whole rootfs finds only pam_userdb, a
          # different module), so nothing answers, connect returns -ENOENT, and
          # login retries the userdb path forever instead of reaching a shell —
          # it never execs bash at all. LOGIN-OK must answer "does the engine
          # reach a shell", not "did we enable another daemon", so the
          # auxiliary module is commented out of the TEST image here, in the
          # prep script, never by hand: a rebuilt image keeps this.
          if [ -f /mnt/m55a-rootfs/etc/pam.d/common-session ]; then
            sudo sed -i \
              -e 's|^session[[:space:]]*optional[[:space:]]*pam_systemd\.so.*|# [uml-nt test image] pam_systemd disabled: no userdbd in this image|' \
              /mnt/m55a-rootfs/etc/pam.d/common-session
            # S434: the replacement appended '\n&' — which INSERTS a comment and
            # KEEPS the active line, so the sed never disabled anything and the
            # enforcement counted active=1 correctly. The whole line is replaced
            # now, and the count is the proof.
            # S433: the 425 enforcement was lost when 426 rewrote this block, and
            # pam_systemd came back unnoticed — pam-mod listed all 18 modules
            # including it. An edit without a verdict is not a fix: count the
            # active lines and refuse to publish if any remains.
            ACTIVE=$(grep -cE '^[[:space:]]*session[[:space:]].*pam_systemd' /mnt/m55a-rootfs/etc/pam.d/common-session || true)
            if [ "${ACTIVE:-0}" -ne 0 ]; then
              echo "[prep] pam_systemd=present active=$ACTIVE" >&2
              echo "pam_systemd is still active — refusing to publish" >&2
              exit 1
            fi
            echo "[prep] pam_systemd=commented active=0"
            echo "--- pam_systemd in common-session ---"
            grep -n pam_systemd /mnt/m55a-rootfs/etc/pam.d/common-session || true
            # S425: two referees on one SHA behaved differently because one of
            # them booted an image this step never touched. The prep must be
            # self-declaring and self-enforcing: the job FAILS if the comment is
            # not in the image, and the boot log carries the verdict plus a hash
            # of the rule that produced it, so no comparison is ever made
            # between two different images again.
            PREP_SHA=$(printf '%s' "${PREP_RULE:-pam_systemd}" | sha256sum | cut -c1-12)
            if grep -q '\[uml-nt test image\] pam_systemd' \
                 /mnt/m55a-rootfs/etc/pam.d/common-session; then
              echo "[prep] pam_systemd=commented sha=$PREP_SHA"
            else
              echo "[prep] pam_systemd=present sha=$PREP_SHA" >&2
              echo "prep did not apply to the image — refusing to publish it" >&2
              exit 1
            fi
          else
            echo "common-session missing — pam_systemd cannot be neutralised"
          fi
          echo "--- masked units in /etc/systemd/system ---"
          ls -l /mnt/m55a-rootfs/etc/systemd/system/ | grep -i cloud || true
          # M5.5b-1 (gate 1/3 of the M5.5b milestone, test-image rule):
          # the defconfig has NO CONFIG_VT/UNIX98_PTYS — /dev/tty1
          # cannot exist, so getty@tty1 can only restart-loop. The
          # console IS a real tty on uml-nt (console.c tty_operations +
          # the launcher stdin reader thread), so console-getty on
          # /dev/console is the headless analogue. Enable it, mask the
          # impossible getty@tty1, and set root/root (shadow-override
          # in the CI COPY only — the canonical base_image artifact
          # stays pristine). Deterministic salt so the diff reviews.
          sudo mkdir -p /mnt/m55a-rootfs/etc/systemd/system/getty.target.wants
          sudo ln -sf /lib/systemd/system/console-getty.service \
            /mnt/m55a-rootfs/etc/systemd/system/getty.target.wants/console-getty.service
          sudo ln -sf /dev/null \
            "/mnt/m55a-rootfs/etc/systemd/system/getty@tty1.service"
          HASH=$(openssl passwd -6 -salt umlnt root)
          sudo sed -i "s|^root:[^:]*:|root:${HASH}:|" \
            /mnt/m55a-rootfs/etc/shadow
          # USER ruling 2026-10 (M5.5b-1-AUTO): the death on the password
          # path is not CI-specific — a real machine crashes the same way —
          # and the kernel-mode hunt is deferred. So the milestone gate is
          # reached by autologin: console-getty starts agetty with
          # --autologin root, which skips the password round entirely. The
          # gate grep is untouched: ^LOGIN-OK still has to appear, only the
          # way we get to a shell changed (USER-approved semantics change).
          sudo mkdir -p /mnt/m55a-rootfs/etc/systemd/system/console-getty.service.d
          # Shelley 225: the binary that already runs well up to the
          # password prompt is login itself, so the autologin belongs to it:
          # -f root skips authentication and keeps everything else login
          # does (pam_session, environment, the shell it spawns). agetty is
          # out of the picture — it was exiting before it ever exec'd login.
          printf '%s\n' \
            '[Service]' \
            'ExecStart=' \
            'ExecStart=-/bin/login -f root' \
            'StandardInput=tty' \
            'TTYPath=/dev/console' \
            'Restart=always' \
            'RestartSec=0' \
            | sudo tee /mnt/m55a-rootfs/etc/systemd/system/console-getty.service.d/autologin.conf >/dev/null
          echo "--- M5.5b-1-AUTO autologin override ---"
          cat /mnt/m55a-rootfs/etc/systemd/system/console-getty.service.d/autologin.conf
          echo "--- M5.5b-1 login prep ---"
          ls -l /mnt/m55a-rootfs/etc/systemd/system/getty.target.wants/ || true
          grep "^root:" /mnt/m55a-rootfs/etc/shadow | cut -c1-14
          sudo umount /mnt/m55a-rootfs

      - name: Upload masked rootfs (CI copy)
        uses: actions/upload-artifact@v4
        with:
          name: m55a-rootfs-bookworm-masked
          path: rootfs-img/base-debian-bookworm.img
          retention-days: 3

  boot:
    needs: kernel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            make
            mingw-w64-x86_64-toolchain

      - name: Build launcher.exe + stub.exe
        shell: msys2 {0}
        run: |
          make -C uml-nt/launcher all
          make -C uml-nt/stub all

      - name: Download vmlinux.elf
        uses: actions/download-artifact@v4
        with:
          name: uml-nt-vmlinux-elf
          path: build

      # The systemd rootfs = the kernel job's MASKED CI copy of
      # base-debian-bookworm.img (Debian 12 cloud, systemd 252,
      # root:root, getty@tty0, fstab /dev/ubda; cloud-init units masked
      # per the D21 test-image rule). Never committed — hard rule.
      - name: Download masked rootfs (CI copy)
        uses: actions/download-artifact@v4
        with:
          name: m55a-rootfs-bookworm-masked
          path: rootfs-img
      - name: Verify masked rootfs landed
        shell: msys2 {0}
        run: ls -lh rootfs-img

      - name: WER LocalDumps for stub.exe (diagnostics only)
        shell: powershell
        run: |
          # Shelley 188: when a process dies unhandled, WER can write a
          # dump that carries the REAL exception record — code, address
          # and the thread context at death, including exceptions the
          # user-mode handlers never saw. Diagnostics only; it does not
          # touch the gate.
          $dir = Join-Path $env:RUNNER_TEMP "uml-dumps"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $k = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\stub.exe"
          New-Item -Path $k -Force | Out-Null
          New-ItemProperty -Path $k -Name DumpFolder -Value $dir -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $k -Name DumpType -Value 2 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $k -Name DumpCount -Value 4 -PropertyType DWord -Force | Out-Null
          Write-Host "LocalDumps -> $dir (Type=2 full)"

      # S85: the GitHub backstop. timeout(1) cannot kill the native launcher
      # (referee 42294016398: 56+ minutes in this step, the 900s bound never
      # firing), and a wedged step costs the whole run's evidence. 25 minutes is
      # past the launcher's own 900s/1800s bound and the ETW watcher's, so a
      # cancel here means something below is stuck — and every later step is
      # if: always, so systemd.log still comes back.
      - name: NATIVE systemd boot (M5.5a + M5.5b-1 login feed)
        timeout-minutes: 25
        shell: msys2 {0}
        env:
          # Shelley 219: a dump after the death never returns, so the stub
          # photographs itself every two seconds and keeps the last three.
          # the snapshots found no death to photograph and cost the run
          # thousands of files; off while the gate is what matters.
          UML_NT_DUMP_MS: "0"
          # Shelley 242: census of every thread in the stub process, with
          # start address and CPU time, so a thread that is not ours can be
          # named instead of guessed at.
          UML_NT_CENSUS: "1"
        run: |
          cd uml-nt/launcher
          set +e
          # 900s (was 420): mem=120M boots go deeper than the old cap
          # could film — the evidence must land before the kill.
          # SYSTEMD_LOG_TARGET=console: init's assert/emergency text
          # defaults to the journald socket — silent when that path
          # misbehaves ("Caught <ABRT>" with NO assertion line before
          # it, run 36804503133). Console target puts the failing
          # assert on the log we actually read.
          #
          # M5.5b-1: TRICKLE the login attempt every ~25s. Run
          # 37009489525: a t=60s feed was GONE before the t~9min
          # "uml login:" prompt (agetty's line setup flushes the
          # queue) — pre-prompt attempts are flushed harmlessly, the
          # first attempt after the prompt logs in, later ones are
          # shell noise (echo LOGIN-OK is idempotent). The designed
          # EOF "park loud" lands when the launcher dies.
          WITNESS_ARG=""
          if [ "${{ inputs.witness_off }}" = "true" ]; then
            WITNESS_ARG="uml_nt_witness=0"
          fi
          XSLEV_ARG=""
          if [ "${{ inputs.xs_lever }}" = "true" ]; then
            XSLEV_ARG="uml_nt_xslever=1"
          fi
          PROBE_ARG=""
          if [ "${{ inputs.probe_off }}" = "true" ]; then
            PROBE_ARG="uml_nt_drexec=0"
          fi
          DBG_ARG=""
          if [ "${{ inputs.debugger }}" = "true" ]; then
            DBG_ARG="uml_nt_dbg=1"
          fi
          VW_ARG=""
          if [ "${{ inputs.veh_window }}" = "true" ]; then
            VW_ARG="uml_nt_vehwin=1"
          fi
          # Shelley 245: capture only the window that matters. The trace is
          # armed the moment the kernel logs the login exec and stopped as
          # soon as a death appears, so the file stays small enough to convert
          # inside a step instead of dying on a hundred and twenty megabytes.
          ETL=$(cygpath -w "$PWD/../uml-kproc.etl")
          (
            for _ in $(seq 1 600); do
              if grep -q "login chain armed" systemd.log 2>/dev/null; then
                logman.exe start umlnt -ets -p Microsoft-Windows-Kernel-Process 0x10 \
                  -o "$ETL" -ct perf -f bin -max 64 -bs 64 -ft 1 >/dev/null 2>&1 \
                  && echo "[etw] armed at $(date +%H:%M:%S)" >> etw-trace.log
                break
              fi
              sleep 1
            done
            for _ in $(seq 1 900); do
              if grep -q "died silently" systemd.log 2>/dev/null; then
                sleep 2
                logman.exe stop umlnt -ets >/dev/null 2>&1 \
                  && echo "[etw] stopped at $(date +%H:%M:%S) (death seen)" >> etw-trace.log
                exit 0
              fi
              sleep 1
            done
          ) &
          ETW_WATCH=$!
          {
            i=0
            while [ $i -lt 36 ]; do
              if [ "${{ inputs.feed }}" != "false" ]; then
                printf 'root\n'; sleep 1
                printf 'root\n'; sleep 1
                printf 'echo LOGIN-OK\n'
                sleep 23
              else
                sleep 26
              fi
              i=$((i+1))
            done
          # -k 30: if the launcher ignores TERM we still get the log back —
          # an instrument that can hang forever costs the whole run's
          # evidence (referee 40794805029 lost everything at 1h01m).
          } | bash bounded-run.sh ${{ inputs.debugger && '1800' || '900' }} ./launcher.exe ../../build/vmlinux \
            "uml_nt_stub=$(cygpath -w "$(pwd)/../stub/stub.exe")" \
            "ubd0=$(cygpath -w ../../rootfs-img/base-debian-bookworm.img)" \
            "mem=120M" \
            "root=98:0" "rw" \
            "SYSTEMD_LOG_TARGET=console" "SYSTEMD_LOG_LOCATION=1" \
            ${WITNESS_ARG:+$WITNESS_ARG} \
            ${PROBE_ARG:+$PROBE_ARG} \
            ${XSLEV_ARG:+$XSLEV_ARG} \
            ${DBG_ARG:+$DBG_ARG} ${VW_ARG:+$VW_ARG} \
            > systemd.log 2>&1
          code=$?
          set -e
          logman.exe stop umlnt -ets >/dev/null 2>&1 || true
          cat etw-trace.log 2>/dev/null || true
          echo "launcher exit: $code (124 = still running at timeout — expected while systemd boots)"
          echo "--- first 25 log lines (ubd attach / early boot) ---"
          head -25 systemd.log
          echo "--- exec chain ---"
          grep -E "execve\(|binfmt_umlnt:" systemd.log | head -40 || true
          # boot-failure-driven: the evidence table first.
          echo "--- not-implemented syscall table (this boot) ---"
          grep "not implemented" systemd.log \
            | sed 's/^\[syscall\] nr=//; s/ not implemented.*//' \
            | sort -n | uniq -c | sort -rn | head -40 || true
          echo "--- last 30 log lines ---"
          tail -30 systemd.log
          echo "--- last console writes from the guest ---"
          grep -E "^\[syscall\] (write|writev|openat|open|execve)" systemd.log | tail -25 || true
          # Gate (D21 era): multi-user.target, fallback journald Started.
          # The env-poison/_strv_env_merge SIGSEGV family still kills
          # ~1/3 of boots pre-journald (COW-repair multi-page suspicion,
          # hunt separate) — a red flake run is re-dispatched for
          # sampling, not treated as a regression. Same ANSI-color
          # lesson as below: "Started <color>Journal Service</color>."
          # never matches the literal — match across the codes.
          if grep -q "Reached target.*Multi-User System" systemd.log; then
            echo "M5.5a GATE OK: multi-user.target reached"
          elif grep -qE "Started.*Journal Service|Journal started" systemd.log; then
            echo "M5.5a GATE OK (fallback): journald Started — multi-user not yet, read the evidence table above"
          else
            echo "M5.5a GATE MISS: neither multi-user.target nor journald Started — boot died before journald"
            exit 1
          fi
          # M5.5b-1 gate (1/3): console-getty login root/root via PAM.
          # The marker = the fed `echo LOGIN-OK` reaching the console
          # log — a shell ran it, so getty + PAM auth + a login shell
          # all worked. Same ANSI lesson: match at line start, the
          # fed command's echo may colorize nothing (raw bytes in).
          if grep -q "^LOGIN-OK" systemd.log; then
            echo "M5.5b-1 GATE OK: root login via console-getty (PAM + shell)"
          else
            echo "M5.5b-1 GATE MISS: no LOGIN-OK marker — login did not complete (termios/ioctl ENOSYS hunt likely, read the syscall table)"
            exit 1
          fi
          # M5.5b close rule (Shelley, after the "green" 36984931372
          # died post-gate): a milestone-closing run may NOT die after
          # the marker — the log from the marker on must be clean of
          # kernel/guest death, or the boot ended only after the fed
          # shell job completed (the designed park-loud EOF is fine).
          MK=$(grep -n "^LOGIN-OK" systemd.log | head -1 | cut -d: -f1)
          if [ -n "$MK" ] && tail -n +"$MK" systemd.log \
              | grep -qE "Caught <|Freezing|KERNEL NATIVE FAULT"; then
            echo "M5.5b GATE MISS: post-marker death in the log (the 36984931372 class) — a milestone cannot close on this run"
            exit 1
          fi
          # Close procedure (not automatable here): the M5.5b gates
          # must pass in TWO CONSECUTIVE runs before the milestone
          # closes — re-dispatch and confirm, tracked in STATUS.

      # S92 (report 392): every future fault names its own function. Three
      # referees faulted at rips that all live inside uml_nt_syscall_handle, and
      # nobody could see that until a human symbolized them by hand against the
      # CI vmlinux — 383 read "outside every image" because it only compared
      # against /bin/login and ld.so, never the kernel image at 0x60000000.
      # This step makes that mistake impossible: any "KERNEL NATIVE FAULT rip=X"
      # in systemd.log is resolved against the vmlinux this run just built.
      - name: Shape of this run (one line, comparable across referees)
        if: always()
        shell: msys2 {0}
        run: |
          # S96: the boot step and this one do not share a cwd, so
          # "tee -a systemd.log" could write a different file from the one
          # uploaded. Find the log the artifact actually carries, and also
          # print the line to the job log so it survives either way.
          F=$(find . -name systemd.log -type f -printf '%p %s\n' 2>/dev/null | sort -k2 -n | tail -1 | cut -d' ' -f1)
          [ -n "$F" ] || F=systemd.log
          echo "shape target: $F"
          VMLINUX=build/vmlinux bash uml-nt/tests/log_shape.sh "$F" | tee -a "$F"

      - name: Symbolize fault rips against this run's vmlinux
        if: always()
        shell: msys2 {0}
        run: |
          set +e
          VL=build/vmlinux
          [ -f "$VL" ] || { echo "FAULT-SYM: no vmlinux to symbolize with"; exit 0; }
          rips=$(grep -oE 'KERNEL NATIVE FAULT[^\n]*rip=[0-9a-fA-F]+' systemd.log 2>/dev/null |
                 grep -oE 'rip=[0-9a-fA-F]+' | cut -d= -f2 | sort -u)
          if [ -z "$rips" ]; then echo "FAULT-SYM: no native fault in this run"; exit 0; fi
          for r in $rips; do
            v="0x$r"
            line=$(llvm-addr2line -f -e "$VL" "$v" 2>/dev/null | tr '\n' ' ')
            echo "FAULT-SYM rip=$v $line"
          done

      - name: Windows error events (faulting module + offset)
        if: always()
        shell: powershell
        continue-on-error: true
        run: |
          # Shelley 246: WER dumps never appeared on this runner, but the
          # Application log still records an event 1000 for an unhandled
          # exception, and that record names the FAULTING MODULE and the
          # offset inside it — the one fact seventeen dumps could not give.
          $since = (Get-Date).AddMinutes(-40)
          try {
            $ev = Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000,1001; StartTime=$since} -ErrorAction Stop
            Write-Host "app error events: $($ev.Count)"
            foreach ($e in $ev | Select-Object -First 10) {
              Write-Host "--- $($e.TimeCreated.ToString('o')) id=$($e.Id)"
              Write-Host $e.Message
            }
          } catch { Write-Host "no application error events: $($_.Exception.Message)" }
          try {
            $ev2 = Get-WinEvent -FilterHashtable @{LogName='System'; Id=1000; StartTime=$since} -ErrorAction SilentlyContinue
            foreach ($e in $ev2 | Select-Object -First 5) { Write-Host "sys1000 $($e.TimeCreated.ToString('o')) $($e.Message)" }
          } catch { }

      - name: ETW window (convert + find the victim)
        if: always()
        shell: powershell
        timeout-minutes: 20
        continue-on-error: true
        run: |
          # Shelley 245: the trace is now a window, not the whole boot, so a
          # conversion fits in a step. The victim's pid is read from this
          # run's own log and matched in BOTH spellings — a decimal pid and a
          # hex pid have already caused one silent miss.
          $etl = "uml-nt\uml-kproc.etl"
          if (!(Test-Path $etl)) { Write-Host "no etl: $etl"; exit 0 }
          Get-Item $etl | Format-List Name,Length | Out-String | Write-Host
          logman query umlnt -ets 2>&1 | Out-String | Write-Host
          $csv = Join-Path $env:RUNNER_TEMP "uml-kproc.csv"
          tracerpt "$etl" -of CSV -o $csv -y 2>&1 | Select-Object -Last 2 | Out-String | Write-Host
          if (!(Test-Path $csv)) { Write-Host "tracerpt produced no csv"; exit 0 }
          $lines = Get-Content $csv
          Write-Host "csv lines: $($lines.Count)"
          $m = Select-String -Path "uml-nt\launcher\systemd.log" -Pattern 'exit-req\] pid (\d+)' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$m) { Write-Host "victim pid not found in the log"; exit 0 }
          $dec = [int]$m.Matches[0].Groups[1].Value
          $hex = '0x{0:X}' -f $dec
          $hex4 = '0x{0:X4}' -f $dec
          Write-Host "victim pid $dec ($hex / $hex4)"
          $hits = $lines | Select-String -Pattern @($hex, $hex4, "\b$dec\b") -SimpleMatch:$false
          Write-Host "victim rows: $($hits.Count)"
          $hits | Select-Object -First 30 | ForEach-Object { Write-Host $_.Line }
          $out = Join-Path $env:RUNNER_TEMP "uml-kproc-victim.txt"
          $hits | ForEach-Object { $_.Line } | Set-Content $out
          # the stop events of the last twenty seconds are the scene of the crime
          Write-Host "--- last 20 Stop rows ---"
          $lines | Select-String -Pattern ', *Stop *,' | Select-Object -Last 20 | ForEach-Object { Write-Host $_.Line }

      - name: Upload systemd.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m55a-systemd-log-${{ github.run_id }}
          path: uml-nt/launcher/systemd.log

      - name: Collect stub self-snapshots from %TEMP% (Windows temp, not runner.temp)
        if: always()
        shell: pwsh
        run: |
          $dst = "uml-nt/launcher"
          $n = 0
          # the msys2 TEMP is where the stub (a msys2 child) writes, and it is
          # not $env:TEMP of this shell — collect from both
          $globs = @("$env:TEMP\stub-loop-*.dmp","$env:TEMP\stub-death-*.dmp",
                     "D:\a\_temp\msys64\tmp\stub-loop-*.dmp",
                     "D:\a\_temp\msys64\tmp\stub-death-*.dmp")
          Get-ChildItem $globs -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination $dst -Force
            Write-Host "collected $($_.Name) $($_.Length) bytes"
            $n++
          }
          Write-Host "stub snapshots collected: $n"

      - name: Upload WER dumps + last-chance record (diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m55a-wer-dumps-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/uml-dumps/*.dmp
            ${{ runner.temp }}/stub-death-*.dmp
            ${{ runner.temp }}/stub-loop-*.dmp
            stub-death-*.dmp
            stub-loop-*.dmp
            uml-nt/launcher/stub-*.dmp
            uml-nt/launcher/stub-unhandled.txt
          if-no-files-found: warn
