name: uml-nt M3 kernel build (D5a cross)

# Builds the freestanding vmlinux.elf (CONFIG_OS_WINDOWS) with clang+lld —
# the D5a path: kernel is built on Linux, runs on Windows via launcher.exe.
# Recipe adapted from lts_latest.yml; pins come from kernel/fetch.sh
# (tarball sha256 verified against kernel.org official sums).
# Native gate asserts: M1 boot, M2 syscall round-trip, M3.1 fault
# round-trip (see the greps in the last job).

on:
  push:
    branches: ["uml-nt/**"]
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential flex bison bc patch \
            xz-utils clang lld llvm

      - name: Fetch pinned v6.18.37 + apply uml-nt overlay
        run: |
          TREE=$(bash uml-nt/kernel/fetch.sh extract)
          bash uml-nt/kernel/apply.sh "$TREE"
          echo "TREE=$TREE" >> "$GITHUB_ENV"

      - name: Configure (uml_nt_defconfig, clang+lld)
        run: |
          make -C "$TREE" O="$(pwd)/build" ARCH=um LLVM=1 CC=clang LD=ld.lld \
            uml_nt_defconfig

      - name: Build vmlinux (clang+lld)
        run: |
          make -C "$TREE" O="$(pwd)/build" ARCH=um LLVM=1 CC=clang LD=ld.lld \
            -j"$(nproc)"

      - name: Freestanding gates (D1/D2)
        run: |
          set -euxo pipefail
          test -f build/vmlinux
          # D1: zero host-libc references may remain undefined or dynamic.
          [ "$(nm -u build/vmlinux | wc -l)" -eq 0 ]
          ! readelf -d build/vmlinux | grep -q NEEDED
          # D2/D9: entry point is our _start (launcher jumps there).
          ENTRY=$(readelf -h build/vmlinux | awk '/Entry point/ {print $4}')
          # readelf prints 0x60022d1f; nm pads to 16 digits — match both.
          nm build/vmlinux | grep -qiE "0*${ENTRY#0x} T _start"

      - name: Upload vmlinux.elf
        uses: actions/upload-artifact@v4
        with:
          name: uml-nt-vmlinux-elf
          path: build/vmlinux

      # M3.4: the probe guest — a real static ELF64 the kernel-side
      # loader loads (execveat(memfd) analogue). Same toolchain as the
      # kernel build; uploaded for the native launcher job.
      - name: Build probe guest ELF
        run: |
          make -C uml-nt/guest CC=clang LD=ld.lld
          readelf -lW uml-nt/guest/guest-init.elf
          test -f uml-nt/guest/guest-init.elf

      - name: Upload guest-init.elf
        uses: actions/upload-artifact@v4
        with:
          name: uml-nt-guest-exec-elf
          path: uml-nt/guest/guest-init.elf

      # M3.5: minimal ext4 root image (static freestanding /sbin/init
      # built from uml-nt/rootfs/init.c, populated via mke2fs -d — no
      # root, no loop device). Uploaded for the native mount gate.
      - name: Build gate rootfs (M3.5)
        run: |
          # musl-gcc builds the busybox that lands in the image (S4c2)
          sudo apt-get install -y musl-tools
          make -C uml-nt/rootfs
          file uml-nt/rootfs/rootfs.ext4

      - name: Upload rootfs.ext4
        uses: actions/upload-artifact@v4
        with:
          name: uml-nt-rootfs-ext4
          path: uml-nt/rootfs/rootfs.ext4

      # M1.9 boot gate (wine): mingw-cross-build launcher.exe + boot the
      # just-built vmlinux.elf — must reach the "no rootfs" panic and
      # exit 1 (os_dump_core → NtTerminateProcess(1)). Fast regression
      # gate; the REAL Windows boot + M2 round-trip run natively below.
      # NOTE: the M2 stub probe canNOT run under wine — wine implements
      # CreateProcess as fork() of a multithreaded parent, and the UML
      # kernel is always multithreaded (timer + longjmp-jumped threads);
      # the forked child breaks in wine's own setup (stack overflow in
      # the exec path) nondeterministically. Native runner = source of
      # truth (verified M2.1: wine sometimes forks fine, sometimes not).
      - name: Boot test under wine (M1.9 gate)
        run: |
          sudo apt-get install -y gcc-mingw-w64-x86-64 wine64
          make -C uml-nt/launcher MINGW_CC=x86_64-w64-mingw32-gcc all
          cd uml-nt/launcher
          set +e
          timeout 120 wine ./launcher.exe ../../build/vmlinux > boot.log 2>&1
          code=$?
          set -e
          cat boot.log
          [ "$code" -eq 1 ] || { echo "expected exit 1 (panic), got $code"; exit 1; }
          # M3.5 note: with ext4 + ubd in the build, UML's default
          # root=98:0 now resolves to a REGISTERED fs list, so the
          # no-image boot panics with "Unable to mount root fs"
          # instead of the old "No filesystem could mount root".
          grep -q "Unable to mount root fs" boot.log || { echo "boot never reached the no-rootfs panic"; exit 1; }
          echo "M1.9 wine boot gate ok"

      # M3.5 mount gate (wine): same vmlinux + the ext4 root image via
      # ubd0=/root= — must mount ext4 (sync ubd path, no io thread) and
      # find /sbin/init in it. Since M3.8 S1 the boot fails FAST after
      # that: the /sbin/init exec dies at bprm_mm_init (no uml_nt_stub=
      # configured for real mm contexts → "mmctx: no stub path
      # configured", error -12, before binfmt search) → panic → exit 1.
      # Exit 1 or 124 (pre-S1 park) both stay inside the assert; the
      # contract is the log.
      - name: Wine ext4 mount gate (M3.5)
        run: |
          cd uml-nt/launcher
          ROOTFS=$(realpath ../rootfs/rootfs.ext4)
          ROOTFS_BS=${ROOTFS//\//\\}
          set +e
          timeout 90 wine ./launcher.exe ../../build/vmlinux \
            "ubd0=Z:${ROOTFS_BS}" "root=/dev/ubda" > mount.log 2>&1
          code=$?
          set -e
          cat mount.log
          [ "$code" -eq 124 ] || [ "$code" -eq 1 ] || { echo "unexpected exit $code (boot hung elsewhere?)"; exit 1; }
          grep -q "EXT4-fs (ubda): mounted filesystem" mount.log || { echo "ext4 never mounted (ubd sync I/O broken?)"; exit 1; }
          grep -q "VFS: Mounted root (ext4 filesystem)" mount.log || { echo "root never mounted"; exit 1; }
          grep -q "Run /sbin/init as init process" mount.log || { echo "/sbin/init never found in the mounted image"; exit 1; }
          grep -q "stdio console ready" mount.log || { echo "M3.6 console driver never registered"; exit 1; }
          echo "M3.5 wine mount gate ok"

  launcher:
    # M1.9: NATIVE Windows boot — build launcher.exe with the MSYS2
    # mingw toolchain, download the vmlinux artifact from the kernel
    # job, boot it for real (no wine) and assert the no-rootfs panic.
    needs: kernel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            make
            mingw-w64-x86_64-toolchain

      - name: Build launcher.exe + stub.exe
        shell: msys2 {0}
        run: |
          make -C uml-nt/launcher all
          make -C uml-nt/stub all

      # M3.8 S4c evidence: musl TLS needs arch_prctl(ARCH_SET_FS) —
      # can a user-written FS base exist on native Windows (FSGSBASE
      # enabled, survives VEH round-trips / scheduling)? Evidence
      # probe, not a gate: exit 0 with markers either way; D18 reads
      # the log.
      - name: FSGSBASE probe (S4c evidence)
        shell: msys2 {0}
        run: |
          make -C uml-nt/probes
          ./uml-nt/probes/fsgsbase.exe

      - name: Usage gate (no args → exit 2)
        shell: msys2 {0}
        run: |
          cd uml-nt/launcher
          set +e
          ./launcher.exe; code=$?
          set -e
          [ "$code" -eq 2 ] || { echo "expected exit 2, got $code"; exit 1; }
          echo "launcher usage gate ok"

      - name: Download vmlinux.elf
        uses: actions/download-artifact@v4
        with:
          name: uml-nt-vmlinux-elf
          path: build

      - name: Download guest-init.elf (M3.4)
        uses: actions/download-artifact@v4
        with:
          name: uml-nt-guest-exec-elf
          path: guest

      - name: Download rootfs.ext4 (M3.5)
        uses: actions/download-artifact@v4
        with:
          name: uml-nt-rootfs-ext4
          path: rootfs

      - name: NATIVE boot test (M1.9 acceptance + M2 round-trip + M3.1 faults + M3.3 fork + M3.4 ELF loader)
        shell: msys2 {0}
        run: |
          cd uml-nt/launcher
          set +e
          timeout 180 ./launcher.exe ../../build/vmlinux \
            "uml_nt_stubtest=$(cygpath -w "$(pwd)/../stub/stub.exe")" \
            "uml_nt_exec=$(cygpath -w ../../guest/guest-init.elf)" \
            > boot.log 2>&1
          code=$?
          set -e
          cat boot.log
          [ "$code" -eq 1 ] || { echo "expected exit 1 (panic), got $code (124 = boot hang — see log)"; exit 1; }
          # M3.5 note: see the wine gate — the no-image panic is now
          # "Unable to mount root fs" (ext4 present, root=98:0 default).
          grep -q "Unable to mount root fs" boot.log || { echo "boot never reached the no-rootfs panic"; exit 1; }
          grep -q "exec loaded: 3 region" boot.log || { echo "M3.4 ELF loader never ran (no exec image loaded)"; exit 1; }
          grep -q "ROUND-TRIP OK" boot.log || { echo "M2 syscall round-trip never completed"; exit 1; }
          grep -q "^hi" boot.log || { echo "guest write output missing"; exit 1; }
          grep -q "FAULT1-OK" boot.log || { echo "M3.1 fault #1 never recovered"; exit 1; }
          grep -q "FAULT2-OK" boot.log || { echo "M3.1 fault #2 never recovered"; exit 1; }
          grep -q "GUARD0-OK" boot.log || { echo "M3.1 protect did not stick (read-back failed)"; exit 1; }
          grep -q "CHILD-ALIVE" boot.log || { echo "M3.3 fork: child never ran (COW stack fault?)"; exit 1; }
          grep -q "PARENT-RESUMED" boot.log || { echo "M3.3 fork: parent never resumed"; exit 1; }
          grep -q "FORK OK: parent exit 0, child exit 7" boot.log || { echo "M3.3 fork exit codes wrong"; exit 1; }
          # M3.8 S1: the real mm-context lifecycle (init_new_context/
          # destroy_context path) — spawn + destroy a bare suspended
          # stub through uml_nt_mmctx_init/destroy.
          grep -q "MMCTX OK" boot.log || { echo "M3.8 S1 mmctx lifecycle never ran"; exit 1; }
          # M3.6: the real console TTY registers (major 4 tty0) and
          # printk routes through it.
          grep -q "stdio console ready" boot.log || { echo "M3.6 console driver never registered"; exit 1; }
          grep -q "console \[tty0\] enabled" boot.log || { echo "M3.6 tty console never enabled (printk not routed)"; exit 1; }
          # M3.7: the D16 syscall surface — wait4 reaps the forked
          # child (status via the D15 uaccess walker), identity
          # syscalls, brk on the reserved heap run, anon mmap/munmap
          # round-trips with stub MAP/UNMAP ops.
          grep -q "WAIT4-OK" boot.log || { echo "M3.7 wait4 never reaped the child"; exit 1; }
          grep -q "PID-OK" boot.log || { echo "M3.7 getpid/getppid/set_tid_address failed"; exit 1; }
          grep -q "SIG-OK" boot.log || { echo "M3.7 rt_sigprocmask failed"; exit 1; }
          grep -q "BRK-OK" boot.log || { echo "M3.7 brk failed"; exit 1; }
          grep -q "MMAP-OK" boot.log || { echo "M3.7 mmap/munmap failed"; exit 1; }
          grep -q "SYSCALL-OK" boot.log || { echo "M3.7 syscall chain incomplete"; exit 1; }
          # M3.8 hazard 3: the fork answer re-protects the PARENT's
          # views read-only (upstream fork marks both pte tables RO);
          # the parent's later .data/heap writes fault into the COW
          # machinery and the child's surgery preserved the sharer's
          # bytes — the markers above now pass THROUGH that path.
          grep -q "fork: re-protected" boot.log || { echo "fork parent re-protect never queued"; exit 1; }
          echo "M1.9 NATIVE BOOT OK + M2 ROUND-TRIP OK + M3.1 FAULTS OK + M3.3 FORK OK + M3.4 ELF LOADER OK + M3.6 CONSOLE OK + M3.7 SYSCALLS OK"

      # M3.5 native mount gate: ubd0 opens the ext4 image through the
      # os-Windows fd table (NtCreateFile), sync do_io serves the reads,
      # ext4 mounts, /sbin/init (static, freestanding) is found in the
      # image. Since M3.8 S1 the boot fails FAST after that: the exec
      # dies at bprm_mm_init (no uml_nt_stub= → "mmctx: no stub path
      # configured") → panic → exit 1. Exit 1 or 124 (pre-S1 park)
      # both stay inside the assert; the log is the contract.
      - name: NATIVE ext4 mount gate (M3.5)
        shell: msys2 {0}
        run: |
          cd uml-nt/launcher
          # artifact downloads to <ws>/rootfs — two levels up from here
          ROOTFS=$(cygpath -w "$(pwd)/../../rootfs/rootfs.ext4")
          # MSYS2 rewrites POSIX-looking args (/dev/ubda → its own /dev
          # tree) when invoking native exes — exclude everything, and
          # use root=98:0 (decimal devt, no slashes; the format UML's
          # own default cmdline uses).
          export MSYS2_ARG_CONV_EXCL="*"
          set +e
          timeout 180 ./launcher.exe ../../build/vmlinux \
            "ubd0=$ROOTFS" "root=98:0" > mount.log 2>&1
          code=$?
          set -e
          cat mount.log
          [ "$code" -eq 124 ] || [ "$code" -eq 1 ] || { echo "unexpected exit $code"; exit 1; }
          grep -q "EXT4-fs (ubda): mounted filesystem" mount.log || { echo "ext4 never mounted (ubd sync I/O broken natively?)"; exit 1; }
          grep -q "VFS: Mounted root (ext4 filesystem)" mount.log || { echo "root never mounted"; exit 1; }
          grep -q "Run /sbin/init as init process" mount.log || { echo "/sbin/init never found in the mounted image"; exit 1; }
          grep -q "stdio console ready" mount.log || { echo "M3.6 console driver never registered"; exit 1; }
          echo "M3.5 NATIVE MOUNT OK: ubd sync I/O + ext4 + /sbin/init"

      # M3.8 S3 — binfmt_umlnt (D17): the ext4 /sbin/init (static,
      # freestanding) execs through do_execve → binfmt_umlnt → the S1
      # conn (VMA/spans) → the S2 userspace() loop serves it; the
      # guest init's write(2) reaches the console via the D16 dispatch
      # and exit(0) halts (panic → exit 1). Same rootfs image as the
      # mount gates — the marker proves the FULL exec chain.
      - name: NATIVE init-exec gate (M3.8 S3 binfmt_umlnt)
        shell: msys2 {0}
        run: |
          cd uml-nt/launcher
          ROOTFS=$(cygpath -w "$(pwd)/../../rootfs/rootfs.ext4")
          export MSYS2_ARG_CONV_EXCL="*"
          set +e
          timeout 180 ./launcher.exe ../../build/vmlinux \
            "uml_nt_stub=$(cygpath -w "$(pwd)/../stub/stub.exe")" \
            "ubd0=$ROOTFS" "root=98:0" > initexec.log 2>&1
          code=$?
          set -e
          cat initexec.log
          [ "$code" -eq 1 ] || [ "$code" -eq 124 ] || { echo "unexpected exit $code"; exit 1; }
          grep -q "EXT4-fs (ubda): mounted filesystem" initexec.log || { echo "ext4 never mounted (ubd sync I/O broken?)"; exit 1; }
          grep -q "Run /sbin/init as init process" initexec.log || { echo "/sbin/init never found"; exit 1; }
          grep -q "stdio console ready" initexec.log || { echo "M3.6 console driver never registered"; exit 1; }
          grep -q "binfmt_umlnt: init loaded" initexec.log || { echo "binfmt_umlnt load_binary never ran (exec failed earlier? see log)"; exit 1; }
          grep -q "INIT-SYSCALL-OK" initexec.log || { echo "guest init never wrote through the exec + userspace() path"; exit 1; }
          # M3.8 S4b: openat/read/close through the REAL guest VFS —
          # sys_call_table routing (upstream handle_syscall parity),
          # guest pointers valid via the D15 uaccess walker. The bytes
          # read back are /hi.sh — the script busybox runs in S4c.
          grep -q "OPENAT-READ-OK: echo hi" initexec.log || { echo "S4b: openat/read never served through the real VFS (see [syscall] ENOSYS lines)"; exit 1; }
          # M3.8 S4c: guest execve — the dispatch's kernel_execve
          # swaps the init task to /bin/step2 (conn switch: exec_mmap
          # destroys the old conn mid-round, the loop bootstraps the
          # new one from current_pt_regs).
          grep -q "STEP2-OK" initexec.log || { echo "S4c: guest execve never completed the conn switch (see [syscall] execve lines)"; exit 1; }
          # M3.8 S4c2: arch_prctl(ARCH_SET_FS) through the dispatch +
          # the stub's D18 re-apply — the %fs:0 read-back rides one
          # full syscall round-trip and only prints on a live TLS
          # base (Windows scheduling does not preserve one). The
          # anonymous mmap check is the musl malloc floor.
          grep -q "TLS-OK" initexec.log || { echo "S4c2: arch_prctl/D18 FS base never survived a syscall round-trip"; exit 1; }
          grep -q "MMAP-OK" initexec.log || { echo "S4c2: anonymous mmap (musl malloc floor) failed"; exit 1; }
          # M3.8 S4c2 acceptance POC: busybox sh (musl, linked in-window)
          # runs /hi.sh — two builtin echos; only busybox's own output
          # produces a BUSYBOX-SHELL-OK line WITHOUT the read marker
          # (the OPENAT-READ-OK line also shows the script bytes).
          grep -q "EXEC2-FAIL" initexec.log && { echo "step2: execve /bin/busybox failed"; exit 1; }
          grep "BUSYBOX-SHELL-OK" initexec.log | grep -qv "OPENAT-READ-OK" || { echo "busybox sh never ran the script (acceptance)"; exit 1; }
          echo "M3.8 S3+S4b+S4c NATIVE INIT-EXEC OK: binfmt_umlnt + userspace() + write(2) + openat/read VFS + execve chain + TLS + busybox sh echo hi"
